name: linux
permissions:
  contents: read

on:
  push:
    paths:
      [
        '.github/workflows/linux.yml',
        'linux/**',
        'src/Effects/**',
      ]
  pull_request:
    paths:
      [
        '.github/workflows/linux.yml',
        'linux/**',
        'src/Effects/**',
      ]

jobs:
  build:
    runs-on: ubuntu-latest
    # The Linux port is developed on Fedora and uses its package versions.
    container: fedora:44
    strategy:
      matrix:
        build_type: ['RelWithDebInfo', 'Debug']

    steps:
      - name: Install dependencies
        run: >
          dnf -y install
          git gcc gcc-c++ cmake ninja-build
          fmt-devel spdlog-devel rapidjson-devel catch-devel
          vulkan-headers vulkan-loader-devel muParser-devel libpng-devel
          wayland-devel wayland-protocols-devel
          pipewire-devel systemd-devel plasma-wayland-protocols-devel wlr-protocols-devel
          mesa-vulkan-drivers vulkan-validation-layers

      - uses: actions/checkout@v4

      # Downloads the pinned DirectX Shader Compiler release (see linux/cmake/Dxc.cmake).
      - name: Configure
        run: cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      # The renderer tests (label "gpu") run on llvmpipe, the software Vulkan
      # implementation of mesa-vulkan-drivers. The capture tests among them
      # need a PipeWire session, which the container does not have, and skip
      # themselves.
      # The test labelled "slow" compiles every effect in six combinations.
      # The compiler is the same binary in both build types, so once is enough.
      - name: Test
        if: matrix.build_type == 'RelWithDebInfo'
        run: ctest --test-dir build --output-on-failure

      - name: Test (without the full effect matrix)
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build --output-on-failure -LE slow
