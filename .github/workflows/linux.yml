name: linux
permissions:
  contents: read

on:
  push:
    paths:
      [
        '.github/workflows/linux.yml',
        'linux/**',
        'src/Effects/**',
        'src/Magpie/Resources.language-*.resw',
        'src/Magpie/Icons/**',
      ]
  pull_request:
    paths:
      [
        '.github/workflows/linux.yml',
        'linux/**',
        'src/Effects/**',
        'src/Magpie/Resources.language-*.resw',
        'src/Magpie/Icons/**',
      ]

jobs:
  build:
    runs-on: ubuntu-latest
    # The Linux port is developed on Fedora and uses its package versions.
    # SYS_NICE: Fedora's sway has that capability on its file, and a
    # container without it cannot start the program at all.
    container:
      image: fedora:44
      options: --cap-add SYS_NICE
    strategy:
      matrix:
        build_type: ['RelWithDebInfo', 'Debug']

    steps:
      - name: Install dependencies
        run: >
          dnf -y install
          git gcc gcc-c++ cmake ninja-build
          fmt-devel spdlog-devel rapidjson-devel catch-devel
          vulkan-headers vulkan-loader-devel muParser-devel libpng-devel
          wayland-devel wayland-protocols-devel
          pipewire-devel systemd-devel plasma-wayland-protocols-devel wlr-protocols-devel
          fontconfig-devel dejavu-sans-fonts
          mesa-vulkan-drivers vulkan-validation-layers
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel qt6-linguist qt6-qtsvg python3
          libxkbcommon-devel
          sway dbus-daemon procps-ng

      - uses: actions/checkout@v4

      # Downloads the pinned releases of the DirectX Shader Compiler, Dear ImGui
      # and the icon font (see linux/cmake/Dxc.cmake and ImGui.cmake).
      - name: Configure
        run: cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      # The renderer tests (label "gpu") run on llvmpipe, the software Vulkan
      # implementation of mesa-vulkan-drivers. The capture tests among them
      # need a PipeWire session, which the container does not have, and skip
      # themselves.
      # The tests of the settings application (label "app") load its window
      # with Qt's platform "offscreen", which needs no display.
      # The tests of the Sway back end and of the nested session start a Sway
      # of their own, which composes in software here. ctest runs one test at
      # a time, which they need on the software renderer: it uses every
      # processor core by itself. The test of the KWin back end needs the
      # program "kwin_wayland" and a PipeWire session and skips itself.
      # The test labelled "slow" compiles every effect in six combinations.
      # The compiler is the same binary in both build types, so once is enough.
      - name: Test
        if: matrix.build_type == 'RelWithDebInfo'
        run: ctest --test-dir build --output-on-failure

      - name: Test (without the full effect matrix)
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build --output-on-failure -LE slow
